<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>happy birthday ♥</title>
<meta name="description" content="a small island, made for you." />
<meta name="theme-color" content="#ffd9e6" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💌</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ═══════════ THE GAME ═══════════ -->
<div class="stage" id="stage">
  <canvas id="screen" width="320" height="192" aria-label="a pixel island you can walk around"></canvas>

  <!-- top-left: how many letters found -->
  <div class="hud hud--notes">
    <span class="hud__heart">♥</span>
    <span class="hud__label">letters</span>
    <span class="hud__count" id="hud-count">0/6</span>
    <span class="hud__track"><span class="hud__fill" id="hud-bar"></span></span>
  </div>

  <!-- top-right: what's playing -->
  <div class="hud hud--music" id="hud-music">
    <span class="hud__note" id="hud-note">·</span>
    <span class="hud__marquee"><span id="hud-track">our song</span></span>
  </div>

  <!-- "press space" nudge, shown when you're next to something -->
  <div class="prompt" id="prompt" hidden>
    <span class="prompt__key">space</span>
    <span id="prompt-label">look</span>
  </div>

  <!-- on-screen controls for phones -->
  <div class="pad" id="pad">
    <div class="pad__dir">
      <button class="pad__btn pad__btn--up"    data-key="up"    aria-label="up">▲</button>
      <button class="pad__btn pad__btn--left"  data-key="left"  aria-label="left">◀</button>
      <button class="pad__btn pad__btn--right" data-key="right" aria-label="right">▶</button>
      <button class="pad__btn pad__btn--down"  data-key="down"  aria-label="down">▼</button>
    </div>
    <button class="pad__action" data-key="action" aria-label="interact">♥</button>
  </div>
</div>

<!-- ═══════════ DIALOG ═══════════ -->
<div class="dialog" id="dialog" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="panel__bar">
      <span class="panel__dots"><i></i><i></i><i></i></span>
      <span class="panel__title" id="dlg-title"></span>
      <button class="panel__close" id="dlg-close" aria-label="close">✕</button>
    </div>

    <div class="panel__body">
      <p class="letter" id="dlg-body"></p>

      <div class="photo" id="dlg-photo" hidden>
        <div class="photo__mat">
          <img id="dlg-img" alt="" />
          <p class="photo__missing" id="dlg-missing" hidden></p>
        </div>
        <p class="photo__sub" id="dlg-sub"></p>
      </div>

      <p class="letter__ps" id="dlg-ps"></p>
      <p class="letter__sign" id="dlg-sign"></p>
    </div>

    <div class="panel__foot">
      <span class="foot--key">press <b>space</b> to close</span>
      <span class="foot--tap">tap outside to close</span>
    </div>
  </div>
</div>

<!-- ═══════════ TITLE SCREEN ═══════════ -->
<div class="title" id="title">
  <div class="title__card">
    <p class="title__super">happy birthday</p>
    <h1 class="title__name" id="title-name"></h1>
    <p class="title__sub" id="title-sub"></p>
    <button class="title__btn" id="start-btn">
      <span id="title-hint">press start</span>
    </button>
    <p class="title__keys">
      <span>arrows / wasd to walk</span>
      <span>space to look</span>
      <span>turn your sound on ♪</span>
    </p>
  </div>
</div>

<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

<script src="js/content.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
